[project]
name = "venta-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "openai-agents>=0.0.3",
  "pydantic-settings>=2.0.0",
  "validators>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"